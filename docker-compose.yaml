# 创建网桥
networks:
  magic-front-network:
    external: false

services:
  # 软负载
  magic-nginx:
    image: nginx:alpine3.20-perl
    container_name: magic-nginx
    ports:
      - "80:80"
    networks:
      - magic-front-network
    volumes:
      # 设置目录挂载
      - ./volumes/conf/nginx.conf:/etc/nginx/conf.d/default.conf
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  magic-web-front:
    image: xxl1997/magic-web-front:0.0.1-SNAPSHOT
    build:
      context: .
    container_name: magic-web-front
    hostname: magic-web-front
    restart: no
    networks:
      - magic-front-network
    environment:
      TZ: Asia/Shanghai
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
