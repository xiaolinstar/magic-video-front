# 创建网桥
networks:
  magic-front-network:
    external: false

services:
  # 软负载
  magic-front-nginx:
    image: nginx:alpine3.20-perl
    container_name: magic-front-nginx
    ports:
      - "80:80"
    networks:
      - magic-front-network
    volumes:
      # 设置目录挂载
      - ./volumes/conf/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./volumes/logs:/var/log/nginx
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:80" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  magic-web-front:
    image: xxl1997/magic-web-front:0.0.1-SNAPSHOT
    build:
      context: .
    container_name: magic-web-front
    hostname: magic-web-front
    restart: no
    networks:
      - magic-front-network
    environment:
      TZ: Asia/Shanghai
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 可观测性

  # Grafana
  # 默认端口3000
  grafana-front:
    image: grafana/grafana:11.3.2-ubuntu
    container_name: grafana-front
    networks:
      - magic-front-network
    ports:
      - "9000:3000"
    volumes:
      - ./volumes/grafana/provisioning/etc/datasources:/etc/grafana/provisioning/datasources:ro
    environment:
      # 中国时区、匿名登陆
      TZ: Asia/Shanghai
      GF_AUTH_ANONYMOUS_ENABLED: true
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_USERS_ALLOW_SIGN_UP: false

  # Loki
  # 默认端口3100
  loki-front:
    image: grafana/loki:3.4
    container_name: loki-front
    volumes:
      - ./volumes/loki/loki-local-config.yaml:/etc/loki/local-config.yaml:ro
    environment:
      TZ: Asia/Shanghai
    networks:
      - magic-front-network
    command:
      - "--config.file=/etc/loki/local-config.yaml"

  promtail-front:
    image: grafana/promtail:3.4
    container_name: promtail-front
    volumes:
      # 设置目录挂载
      - ./volumes/promtail/promtail.yaml:/etc/promtail/promtail.yaml:ro
      - ./volumes/logs:/var/log
    environment:
      TZ: Asia/Shanghai
    networks:
      - magic-front-network
    command:
      - "--config.file=/etc/promtail/promtail.yaml" # promtail配置文件
    depends_on:
      - loki-front

